<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — peace</title>
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>

<body>

  <header>
    <a href="{{ '/' | relative_url }}">peace</a>
  </header>

  <main>
    <article>

      <p class="article-date">
        {{ page.first_date }}{% if page.last_updated %} – {{ page.last_updated }}{% endif %}
      </p>

      <h1>{{ page.title }}</h1>

      <div class="article-content">
        {{ content }}
      </div>

    </article>
  </main>

  <footer>
    by satomi
  </footer>

</body>
</html>
